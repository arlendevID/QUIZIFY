name: quizify_app
description: "Quizify Application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^14.2.0

  # API
  http: ^1.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Icon APK
  flutter_launcher_icons: ^0.13.1


# Konfigurasi icon aplikasi
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"


flutter:

  uses-material-design: true

  assets:
    - assets/icon/logo.png